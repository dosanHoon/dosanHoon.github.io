<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title3 desc3">
  <title id="title3">피드백 루프</title>
  <desc id="desc3">업무 루프의 댓글과 실패가 개선 에이전트를 거쳐 에이전트 정의와 메모리로 돌아가 다음 실행에 반영된다.</desc>
  <rect width="720" height="340" rx="12" fill="#18181F"/>
  <text x="360" y="28" text-anchor="middle" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13">업무 루프 위에 얹는 피드백 루프</text>
  <rect x="40" y="48" width="640" height="56" rx="10" fill="#1E1E28" stroke="#27272F"/>
  <text x="360" y="70" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="11">업무 루프</text>
  <text x="360" y="90" text-anchor="middle" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="600">파악 → 수정 → QA → 머지</text>
  <line x1="360" y1="104" x2="360" y2="128" stroke="#F7A046" stroke-width="2"/>
  <polygon points="354,128 360,138 366,128" fill="#F7A046"/>
  <text x="438" y="126" fill="#F7A046" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="12">실패 · 댓글 · 지시</text>
  <rect x="210" y="148" width="300" height="52" rx="10" fill="#1E1E28" stroke="#F7A046"/>
  <text x="360" y="170" text-anchor="middle" fill="#F7A046" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="12">배치로 도는</text>
  <text x="360" y="190" text-anchor="middle" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="600">개선 에이전트</text>
  <line x1="280" y1="200" x2="280" y2="224" stroke="#7C8AFF" stroke-width="2"/>
  <polygon points="274,224 280,232 286,224" fill="#7C8AFF"/>
  <line x1="440" y1="200" x2="440" y2="224" stroke="#34D399" stroke-width="2"/>
  <polygon points="434,224 440,232 446,224" fill="#34D399"/>
  <rect x="80" y="236" width="220" height="48" rx="10" fill="#1E1E28" stroke="#7C8AFF"/>
  <text x="190" y="266" text-anchor="middle" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600">에이전트 정의 수정</text>
  <rect x="420" y="236" width="220" height="48" rx="10" fill="#1E1E28" stroke="#34D399"/>
  <text x="530" y="266" text-anchor="middle" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600">프로젝트 메모리에 기록</text>
  <polyline points="80,260 24,260 24,76 40,76" fill="none" stroke="#7C8AFF" stroke-width="1.5"/>
  <polygon points="40,70 48,76 40,82" fill="#7C8AFF"/>
  <polyline points="640,260 696,260 696,76 680,76" fill="none" stroke="#34D399" stroke-width="1.5"/>
  <polygon points="680,70 672,76 680,82" fill="#34D399"/>
  <text x="360" y="318" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13">다음 실행의 규칙이 된다</text>
</svg>
