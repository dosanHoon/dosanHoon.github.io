<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="title desc">
  <title id="title">CI 에이전트 간 Docker builder 캐시 공유 구조</title>
  <desc id="desc">각 CI 에이전트의 로컬 캐시에 의존하던 빌드를 레지스트리 builder 캐시로 공유하고, Gradle 멀티모듈 컴파일을 Docker 레이어로 분리한 구조.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71717A"/>
    </marker>
  </defs>
  <rect width="880" height="390" rx="14" fill="#18181F"/>
  <text x="440" y="32" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="14">Docker cache · CI 에이전트 밖으로 꺼내고 모듈 경계에 맞춤</text>

  <text x="32" y="72" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600">기존 · 에이전트 로컬 캐시</text>
  <rect x="32" y="88" width="188" height="76" rx="10" fill="#22222D" stroke="#52525B"/>
  <text x="126" y="117" text-anchor="middle" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="14">CI Agent A</text>
  <text x="126" y="142" text-anchor="middle" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="12">local cache 있음 · 6분대</text>
  <rect x="254" y="88" width="188" height="76" rx="10" fill="#22222D" stroke="#52525B"/>
  <text x="348" y="117" text-anchor="middle" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="14">CI Agent B</text>
  <text x="348" y="142" text-anchor="middle" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="12">local cache 없음 · 12분대</text>
  <line x1="220" y1="126" x2="254" y2="126" stroke="#52525B" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="237" y="113" text-anchor="middle" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="10">공유 안 됨</text>

  <text x="32" y="208" fill="#7C8AFF" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600">변경 · 레지스트리 캐시 + 모듈별 레이어</text>
  <rect x="32" y="226" width="150" height="62" rx="10" fill="#22222D" stroke="#52525B"/>
  <text x="107" y="253" text-anchor="middle" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13">어떤 CI Agent든</text>
  <text x="107" y="273" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="11">cache-from</text>
  <line x1="182" y1="257" x2="234" y2="257" stroke="#71717A" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="218" width="176" height="78" rx="10" fill="#25223A" stroke="#7C8AFF"/>
  <text x="328" y="248" text-anchor="middle" fill="#7C8AFF" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="600">Registry</text>
  <text x="328" y="273" text-anchor="middle" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="12">builder-cache</text>
  <line x1="416" y1="257" x2="462" y2="257" stroke="#71717A" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="468" y="218" width="88" height="78" rx="9" fill="#1E2A27" stroke="#34D399"/>
  <text x="512" y="249" text-anchor="middle" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="12" font-weight="600">core</text>
  <text x="512" y="273" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="10">jar</text>
  <line x1="556" y1="257" x2="578" y2="257" stroke="#71717A" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="584" y="218" width="88" height="78" rx="9" fill="#1E2A27" stroke="#34D399"/>
  <text x="628" y="246" text-anchor="middle" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="600">common</text>
  <text x="628" y="263" text-anchor="middle" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="11" font-weight="600">infra</text>
  <text x="628" y="281" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="10">jar</text>
  <line x1="672" y1="257" x2="694" y2="257" stroke="#71717A" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="700" y="218" width="148" height="78" rx="9" fill="#33291E" stroke="#F7A046"/>
  <text x="774" y="248" text-anchor="middle" fill="#F7A046" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="600">web / ops-web</text>
  <text x="774" y="273" text-anchor="middle" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="10">bootJar · 바뀐 모듈만</text>

  <line x1="774" y1="296" x2="774" y2="326" stroke="#71717A" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="676" y="332" width="196" height="38" rx="9" fill="#22222D" stroke="#F7A046"/>
  <text x="774" y="356" text-anchor="middle" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="12">최종 runtime image</text>

  <text x="32" y="354" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="12">web 소스만 바뀌면 core · common · infrastructure 레이어는 CACHED</text>
</svg>
