# 로컬 글쓰기 설정 (Decap CMS) — 사용법은 WRITING.md
# local_backend: localhost에서는 decap-server(:8081)를 통해 이 저장소의 파일을 직접 읽고 쓴다.
# 저장해도 커밋·push는 되지 않는다. 확인 후 직접 커밋한다.
local_backend: true

# localhost가 아닐 때 쓰는 백엔드. 운영에는 /admin을 배포하지 않으므로 지금은 쓰이지 않는다.
backend:
  name: github
  repo: dosanHoon/dosanHoon.github.io
  branch: develop

locale: ko
site_url: https://dosanhoon.github.io
display_url: https://dosanhoon.github.io
logo_url: /avatar_profile.png

media_folder: static/media
public_folder: /media

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: '-'

collections:
  - name: posts
    label: 글
    label_singular: 글
    description: 새 글은 초안(draft)으로 시작합니다. 공개하려면 초안을 끄고 저장한 뒤 커밋·push 하세요.
    folder: content/posts
    extension: markdown
    format: frontmatter
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    sortable_fields: [date, title, category]
    view_filters:
      - { label: 초안, field: draft, pattern: true }
      - { label: 공개, field: draft, pattern: false }
    # 필드 순서 = 기존 글 frontmatter 순서 (저장 시 diff 최소화)
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 날짜, name: date, widget: datetime }
      - { label: Template, name: template, widget: hidden, default: post }
      - { label: 초안 (켜 두면 공개되지 않음), name: draft, widget: boolean, default: true }
      - label: URL
        name: slug
        widget: string
        hint: '/posts/영문-소문자-하이픈 형식. 공개 뒤에는 바꾸지 마세요(주소가 바뀝니다).'
        pattern: ['^/posts/[a-z0-9]+(-[a-z0-9]+)*$', '/posts/로 시작하는 영문 소문자·숫자·하이픈만 쓸 수 있습니다']
      - label: 카테고리
        name: category
        widget: select
        # value는 기존 글과 /category/<slug> 주소에 쓰이는 원래 값. 표시 이름만 다르다.
        options:
          - { label: AI, value: AI }
          - { label: DX, value: DX }
          - { label: Frontend, value: Frontend }
          - { label: DevOps, value: DevOps }
          - { label: React, value: REACT }
          - { label: MobX, value: MOBX }
          - { label: JavaScript, value: JAVASCRIPT }
      - { label: 태그, name: tags, widget: list, required: false, allow_add: true }
      - { label: 요약 (카드·검색 결과 설명), name: description, widget: text }
      - label: 본문
        name: body
        widget: markdown
        # 마크다운 원문 모드를 기본으로 둔다. 리치 텍스트 모드는 표·HTML(<figure>)을 바꿔 저장할 수 있다.
        modes: [raw, rich_text]

  - name: pages
    label: 페이지
    files:
      # About에는 draft 필드가 없다. draft를 추가하면 페이지가 사라지므로 필드를 두지 않는다.
      - name: about
        label: About me
        file: content/pages/about.md
        fields:
          - { label: 제목, name: title, widget: string }
          - { label: Template, name: template, widget: hidden, default: page }
          - { label: 본문, name: body, widget: markdown, modes: [raw, rich_text] }
